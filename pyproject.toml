[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-map"
version = "0.1.0"
description = "Wave Map"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "luke"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0", 
    "matplotlib>=3.5.0",
    "gmsh>=4.8.0",
    "pyvista>=0.35.0",
    "panel>=1.0.0",
    "sympy>=1.9.0",
    "tomli>=2.0.0; python_version<'3.11'",
    "toml>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "black>=22.0.0",
]

[project.scripts]
wave-simulation = "wave_simulator.cli.run_simulation:main"
wave-emulator = "wave_simulator.cli.run_emulator:main"
wave-gui = "wave_simulator.cli.run_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Include default TOML configs inside wave_simulator package
"wave_simulator" = ["config/*.toml"]
