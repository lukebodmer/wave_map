[general]
batch_name = "profiling_tests"
number_initial_parameter_files_to_create = 10
base_config_path = "parameters.toml"

[inclusion]
inclusion_wave_speed_range = [2.0, 4.0]
inclusion_density_range = [2.0, 4.0]
inclusion_scaling_range = [
    [0.125, 0.375],  # axis_u
    [0.125, 0.375],  # axis_v
    [0.125, 0.375],  # axis_w
]
allow_inclusion_to_rotate = true
allow_inclusion_to_move = false
inclusion_is_sphere = true
inclusion_is_ellipsoid_of_revolution = false

[geometry]
boundary_buffer = 0.05

