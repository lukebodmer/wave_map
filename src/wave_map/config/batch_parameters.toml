[general]
batch_name = "multi-cube-500"
number_initial_parameter_files_to_create = 500
base_config_path = "parameters.toml"

[inclusion]
inclusion_wave_speed_range = [2.0, 2.0]
inclusion_density_range =    [2.0, 2.0]
inclusion_scaling_range = [
    [0.325, 0.375],  # axis_x
    [0.325, 0.375],  # axis_y
    [0.325, 0.375],  # axis_z
]
allow_inclusion_to_rotate = false
allow_inclusion_to_move = false
inclusion_is_sphere = false
inclusion_is_ellipsoid_of_revolution = false
inclusions_are_multi_cubes = true
cube_quantity_range = [1, 3]
cube_width_range = [0.2, 0.2]

[geometry]
boundary_buffer = 0.08

