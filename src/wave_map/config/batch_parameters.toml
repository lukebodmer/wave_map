[general]
batch_name = "rotating_ellipsoid"
number_initial_parameter_files_to_create = 500
base_config_path = "parameters.toml"

[inclusion]
inclusion_wave_speed_range = [2.0, 4.0]
inclusion_density_range =    [2.0, 4.0]
inclusion_scaling_range = [
    [0.125, 0.375],  # axis_x
    [0.125, 0.375],  # axis_y
    [0.125, 0.375],  # axis_z
]
allow_inclusion_to_rotate = true
allow_inclusion_to_move = false
inclusion_is_sphere = false
inclusion_is_ellipsoid_of_revolution = true 
inclusions_are_multi_cubes = false
#cube_quantity_range = [1, 3]
#cube_width_range = [0.2, 0.2]

[geometry]
boundary_buffer = 0.05

